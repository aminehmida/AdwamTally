name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: VERSION="${GITHUB_REF_NAME#v}" INSTALL_DIR="$PWD/dist" ./build-app.sh
      - name: Package
        run: ditto -c -k --keepParent "dist/AdwamTally.app" AdwamTally.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" AdwamTally.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
